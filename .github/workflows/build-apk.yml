name: Build Lumen Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install

      - name: ⚙️ Generate Native Android Project (Expo Prebuild)
        run: npx expo prebuild --platform android --clean --no-install

      - name: 🔨 Build Standalone Release APK via Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../lumen.apk
          cd ..

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lumen-APK
          path: ./lumen.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v3.0.0-build-${{ github.run_number }}
          name: Lumen Acadêmico v3.0 (Build #${{ github.run_number }})
          body: |
            📱 **Lumen Acadêmico v3.0 (Build #${{ github.run_number }})**

            ✨ **Novidades do Lumen 3.0:**
            - 🎓 **Lumen AI (Professor & Tutor Socrático):** Condução do aprendizado com perguntas pedagógicas ou resolução passo a passo direta.
            - 📈 **Rastreador de Histórico & Simulador What-If de CR:** Projeções de CR em tempo real, cálculo de parada/pior caso com 0s e meta de bolsa.
            - 🎓 **Matriz Curricular & % de Conclusão do Curso:** Cálculo de integralização por créditos e semestres com badges limpos de confirmação.
            - 🤖 **3 Níveis de IA Offline no Sandbox:** Leve (~340 MB), Equilibrado (~1.18 GB) e Completo (~2.45 GB) com gerenciamento de espaço.
            - 🗓️ **Semestres Automáticos & Grade Integrada:** Reconhecimento automático do semestre (.1 ou .2) e visualizador de grade semanal na Agenda.
            - ⏱️ **Cronômetro Livre & Modo Tela Cheia:** Alternância fluida de Pomodoro regressivo e progressivo com imersão total.
          files: ./lumen.apk
