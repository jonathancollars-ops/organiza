name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Install EAS CLI
        run: npm install -g eas-cli

      - name: 🔨 Build Android APK via Local EAS
        run: |
          eas build --platform android --profile preview --local --non-interactive --output ./organiza.apk

      - name: 📤 Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Organiza-APK
          path: ./organiza.apk
          retention-days: 30

      - name: 🚀 Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: v1.0.0-build-${{ github.run_number }}
          name: Organiza App (Build #${{ github.run_number }})
          body: |
            📱 **Organiza APK**
            - Correções de layout nas abas de Faltas, Notas e Grade
            - Semestres em formato pílula compacto
            - Barra de notificações oculta
          files: ./organiza.apk
